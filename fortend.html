<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>EduCore — School Management</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<style>
  /* ── Reset & Variables ─────────────────────────────── */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:        #0f1117;
    --surface:   #181c27;
    --surface2:  #1e2335;
    --border:    #2a2f45;
    --accent:    #6c8ef5;
    --accent2:   #a78bfa;
    --gold:      #f5c76c;
    --success:   #4ade80;
    --danger:    #f87171;
    --warn:      #fbbf24;
    --text:      #e8ecf8;
    --muted:     #7a84a8;
    --font-head: 'DM Serif Display', Georgia, serif;
    --font-body: 'DM Sans', system-ui, sans-serif;
    --radius:    12px;
    --shadow:    0 4px 32px rgba(0,0,0,.45);
  }

  html { font-size: 15px; scroll-behavior: smooth; }
  body {
    font-family: var(--font-body);
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    overflow-x: hidden;
  }

  /* ── Sidebar ────────────────────────────────────────── */
  #sidebar {
    width: 240px;
    min-height: 100vh;
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    position: fixed;
    top: 0; left: 0;
    z-index: 100;
    transition: transform .3s ease;
  }

  .sidebar-logo {
    padding: 28px 24px 20px;
    border-bottom: 1px solid var(--border);
  }
  .sidebar-logo h1 {
    font-family: var(--font-head);
    font-size: 1.6rem;
    color: var(--accent);
    letter-spacing: -.5px;
  }
  .sidebar-logo span { color: var(--gold); }
  .sidebar-logo p { font-size: .72rem; color: var(--muted); margin-top: 2px; letter-spacing: .5px; text-transform: uppercase; }

  .sidebar-user {
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .avatar {
    width: 36px; height: 36px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    display: flex; align-items: center; justify-content: center;
    font-weight: 600; font-size: .85rem; color: #fff; flex-shrink: 0;
  }
  .sidebar-user .info { overflow: hidden; }
  .sidebar-user .uname { font-size: .85rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sidebar-user .urole { font-size: .7rem; color: var(--accent); text-transform: uppercase; letter-spacing: .6px; }

  .nav-section { padding: 12px 12px 4px; }
  .nav-label { font-size: .65rem; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; padding: 0 10px 8px; }

  .nav-item {
    display: flex; align-items: center; gap: 12px;
    padding: 9px 12px;
    border-radius: 8px;
    cursor: pointer;
    font-size: .875rem;
    color: var(--muted);
    transition: all .18s;
    user-select: none;
    border: none; background: none; width: 100%; text-align: left;
  }
  .nav-item:hover { background: var(--surface2); color: var(--text); }
  .nav-item.active { background: rgba(108,142,245,.15); color: var(--accent); }
  .nav-item .icon { font-size: 1.05rem; width: 20px; text-align: center; }

  .sidebar-footer {
    margin-top: auto;
    padding: 16px;
    border-top: 1px solid var(--border);
  }
  .btn-logout {
    width: 100%; padding: 9px; border-radius: 8px;
    background: rgba(248,113,113,.1); color: var(--danger);
    border: 1px solid rgba(248,113,113,.25);
    cursor: pointer; font-family: var(--font-body); font-size: .875rem;
    transition: all .2s;
  }
  .btn-logout:hover { background: rgba(248,113,113,.2); }

  /* ── Main ───────────────────────────────────────────── */
  #main {
    margin-left: 240px;
    flex: 1;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }

  #topbar {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 16px 32px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky; top: 0; z-index: 50;
  }
  #topbar h2 { font-family: var(--font-head); font-size: 1.4rem; font-weight: 400; }
  .topbar-right { display: flex; align-items: center; gap: 12px; }
  .badge-role {
    padding: 4px 12px; border-radius: 20px; font-size: .72rem; font-weight: 600;
    text-transform: uppercase; letter-spacing: .6px;
  }
  .badge-admin  { background: rgba(108,142,245,.2); color: var(--accent); }
  .badge-teacher{ background: rgba(167,139,250,.2); color: var(--accent2); }
  .badge-student{ background: rgba(74,222,128,.2);  color: var(--success); }

  #content { padding: 32px; flex: 1; }

  /* ── Login Screen ───────────────────────────────────── */
  #login-screen {
    min-height: 100vh; width: 100%;
    display: flex; align-items: center; justify-content: center;
    background: var(--bg);
    position: fixed; inset: 0; z-index: 999;
  }
  .login-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 48px 44px;
    width: 420px;
    box-shadow: var(--shadow);
    animation: slideUp .5s ease;
  }
  @keyframes slideUp {
    from { opacity: 0; transform: translateY(30px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .login-card .brand { text-align: center; margin-bottom: 36px; }
  .login-card .brand h1 { font-family: var(--font-head); font-size: 2.2rem; color: var(--accent); }
  .login-card .brand p  { color: var(--muted); font-size: .85rem; margin-top: 6px; }

  /* ── Form Elements ──────────────────────────────────── */
  .form-group { margin-bottom: 18px; }
  .form-group label { display: block; font-size: .8rem; color: var(--muted); margin-bottom: 7px; font-weight: 500; }
  .form-control {
    width: 100%; padding: 10px 14px;
    background: var(--bg); border: 1px solid var(--border);
    border-radius: 8px; color: var(--text);
    font-family: var(--font-body); font-size: .9rem;
    transition: border-color .2s;
    outline: none;
  }
  .form-control:focus { border-color: var(--accent); }
  select.form-control { cursor: pointer; }

  .btn {
    padding: 10px 20px; border-radius: 8px;
    cursor: pointer; font-family: var(--font-body); font-size: .9rem;
    font-weight: 500; transition: all .18s; border: none;
  }
  .btn-primary {
    background: var(--accent); color: #fff;
    box-shadow: 0 4px 16px rgba(108,142,245,.3);
  }
  .btn-primary:hover { background: #7d9cf7; transform: translateY(-1px); }
  .btn-primary:disabled { opacity: .5; cursor: not-allowed; transform: none; }
  .btn-secondary { background: var(--surface2); color: var(--text); border: 1px solid var(--border); }
  .btn-secondary:hover { background: var(--border); }
  .btn-danger { background: rgba(248,113,113,.15); color: var(--danger); border: 1px solid rgba(248,113,113,.3); }
  .btn-danger:hover { background: rgba(248,113,113,.25); }
  .btn-success { background: rgba(74,222,128,.15); color: var(--success); border: 1px solid rgba(74,222,128,.3); }
  .btn-sm { padding: 5px 12px; font-size: .8rem; }
  .btn-full { width: 100%; }

  /* ── Cards & Stats ──────────────────────────────────── */
  .stats-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 18px; margin-bottom: 32px;
  }
  .stat-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 22px 24px;
    position: relative; overflow: hidden;
    animation: fadeIn .4s ease both;
  }
  .stat-card::before {
    content: '';
    position: absolute; top: 0; left: 0; right: 0; height: 3px;
    background: var(--c, var(--accent));
  }
  .stat-card .label { font-size: .75rem; color: var(--muted); text-transform: uppercase; letter-spacing: .6px; }
  .stat-card .value { font-family: var(--font-head); font-size: 2.2rem; margin: 6px 0 2px; color: var(--text); }
  .stat-card .icon-bg {
    position: absolute; right: 16px; top: 50%; transform: translateY(-50%);
    font-size: 2.5rem; opacity: .1;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    animation: fadeIn .35s ease both;
  }
  .card-header {
    padding: 18px 24px;
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
  }
  .card-header h3 { font-size: 1rem; font-weight: 600; }
  .card-body { padding: 24px; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* ── Table ──────────────────────────────────────────── */
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: .875rem; }
  thead th {
    padding: 12px 16px; text-align: left;
    color: var(--muted); font-weight: 500; font-size: .75rem;
    text-transform: uppercase; letter-spacing: .6px;
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
  }
  tbody tr { border-bottom: 1px solid rgba(42,47,69,.6); transition: background .15s; }
  tbody tr:last-child { border-bottom: none; }
  tbody tr:hover { background: rgba(108,142,245,.05); }
  tbody td { padding: 13px 16px; vertical-align: middle; }

  /* ── Badges ─────────────────────────────────────────── */
  .tag {
    display: inline-block; padding: 3px 10px;
    border-radius: 20px; font-size: .72rem; font-weight: 600;
  }
  .tag-green  { background: rgba(74,222,128,.15);  color: var(--success); }
  .tag-red    { background: rgba(248,113,113,.15); color: var(--danger); }
  .tag-yellow { background: rgba(251,191,36,.15);  color: var(--warn); }
  .tag-blue   { background: rgba(108,142,245,.15); color: var(--accent); }
  .tag-purple { background: rgba(167,139,250,.15); color: var(--accent2); }

  /* ── Modal ──────────────────────────────────────────── */
  .modal-overlay {
    position: fixed; inset: 0; z-index: 500;
    background: rgba(0,0,0,.7); backdrop-filter: blur(4px);
    display: flex; align-items: center; justify-content: center;
    padding: 24px;
    animation: fadeOverlay .2s ease;
  }
  @keyframes fadeOverlay { from { opacity:0; } to { opacity:1; } }
  .modal {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    width: 100%; max-width: 520px;
    max-height: 90vh; overflow-y: auto;
    box-shadow: var(--shadow);
    animation: slideUp .3s ease;
  }
  .modal-header {
    padding: 20px 24px;
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
  }
  .modal-header h3 { font-size: 1.05rem; font-weight: 600; }
  .modal-close {
    background: none; border: none; color: var(--muted);
    font-size: 1.3rem; cursor: pointer; line-height: 1;
    transition: color .15s;
  }
  .modal-close:hover { color: var(--text); }
  .modal-body { padding: 24px; }
  .modal-footer {
    padding: 16px 24px;
    border-top: 1px solid var(--border);
    display: flex; justify-content: flex-end; gap: 10px;
  }

  /* ── Toast ──────────────────────────────────────────── */
  #toast-container {
    position: fixed; bottom: 24px; right: 24px;
    z-index: 9999; display: flex; flex-direction: column; gap: 10px;
  }
  .toast {
    padding: 12px 18px; border-radius: 10px;
    font-size: .875rem; font-weight: 500;
    box-shadow: 0 8px 32px rgba(0,0,0,.4);
    animation: toastIn .3s ease;
    max-width: 320px;
  }
  @keyframes toastIn { from { opacity:0; transform:translateX(30px); } to { opacity:1; transform:translateX(0); } }
  .toast-success { background: rgba(74,222,128,.15); border: 1px solid rgba(74,222,128,.4); color: var(--success); }
  .toast-error   { background: rgba(248,113,113,.15); border: 1px solid rgba(248,113,113,.4); color: var(--danger); }
  .toast-info    { background: rgba(108,142,245,.15); border: 1px solid rgba(108,142,245,.4); color: var(--accent); }

  /* ── Report Card ────────────────────────────────────── */
  .report-header {
    background: linear-gradient(135deg, var(--accent) 0%, var(--accent2) 100%);
    border-radius: 12px; padding: 28px 32px; margin-bottom: 24px; color: #fff;
    display: flex; align-items: center; justify-content: space-between;
  }
  .report-header h2 { font-family: var(--font-head); font-size: 1.6rem; }
  .report-header .grade-big {
    font-family: var(--font-head); font-size: 3.5rem; line-height: 1;
    background: rgba(255,255,255,.2); padding: 10px 22px; border-radius: 12px;
  }

  /* ── Attendance Bar ─────────────────────────────────── */
  .att-bar { height: 8px; border-radius: 4px; background: var(--border); overflow: hidden; margin: 6px 0; }
  .att-bar-fill { height: 100%; border-radius: 4px; transition: width .8s cubic-bezier(.4,0,.2,1); }

  /* ── Misc ───────────────────────────────────────────── */
  .section-title { font-family: var(--font-head); font-size: 1.5rem; margin-bottom: 6px; }
  .section-sub   { color: var(--muted); font-size: .875rem; margin-bottom: 24px; }
  .row { display: flex; gap: 18px; flex-wrap: wrap; }
  .col { flex: 1; min-width: 220px; }
  .text-muted { color: var(--muted); }
  .text-right { text-align: right; }
  .mt-16 { margin-top: 16px; }
  .mt-24 { margin-top: 24px; }
  .hidden { display: none !important; }
  .loader {
    display: inline-block; width: 18px; height: 18px;
    border: 2px solid rgba(108,142,245,.3);
    border-top-color: var(--accent);
    border-radius: 50%; animation: spin .7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .empty-state { text-align: center; padding: 48px 24px; color: var(--muted); }
  .empty-state .emoji { font-size: 2.5rem; margin-bottom: 12px; }

  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; }
  @media (max-width: 700px) { .grid-2, .grid-3 { grid-template-columns: 1fr; } }

  /* scrollbar */
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
</style>
</head>
<body>

<!-- ── Login ─────────────────────────────────────────── -->
<div id="login-screen">
  <div class="login-card">
    <div class="brand">
      <h1>Edu<span style="color:var(--gold)">Core</span></h1>
      <p>School Management System</p>
    </div>
    <div class="form-group">
      <label>Username</label>
      <input id="l-user" class="form-control" placeholder="admin" value="admin" />
    </div>
    <div class="form-group">
      <label>Password</label>
      <input id="l-pass" class="form-control" type="password" placeholder="••••••••" value="admin123" />
    </div>
    <div id="login-err" style="color:var(--danger);font-size:.82rem;margin-bottom:14px;display:none;"></div>
    <button class="btn btn-primary btn-full" id="login-btn" onclick="doLogin()">Sign In</button>
    <p style="text-align:center;color:var(--muted);font-size:.78rem;margin-top:20px;">
      Default: admin / admin123
    </p>
  </div>
</div>

<!-- ── App Shell ──────────────────────────────────────── -->
<nav id="sidebar">
  <div class="sidebar-logo">
    <h1>Edu<span>Core</span></h1>
    <p>School Management</p>
  </div>
  <div class="sidebar-user">
    <div class="avatar" id="sb-avatar">A</div>
    <div class="info">
      <div class="uname" id="sb-name">Admin</div>
      <div class="urole" id="sb-role">admin</div>
    </div>
  </div>

  <div class="nav-section">
    <div class="nav-label">Overview</div>
    <button class="nav-item active" onclick="showPage('dashboard')" id="nav-dashboard">
      <span class="icon">🏠</span> Dashboard
    </button>
  </div>

  <div class="nav-section" id="nav-admin-section">
    <div class="nav-label">Management</div>
    <button class="nav-item" onclick="showPage('students')" id="nav-students">
      <span class="icon">🎓</span> Students
    </button>
    <button class="nav-item" onclick="showPage('teachers')" id="nav-teachers">
      <span class="icon">👨‍🏫</span> Teachers
    </button>
    <button class="nav-item" onclick="showPage('classes')" id="nav-classes">
      <span class="icon">🏛️</span> Classes
    </button>
    <button class="nav-item" onclick="showPage('subjects')" id="nav-subjects">
      <span class="icon">📚</span> Subjects
    </button>
  </div>

  <div class="nav-section">
    <div class="nav-label">Academics</div>
    <button class="nav-item" onclick="showPage('results')" id="nav-results">
      <span class="icon">📊</span> Results
    </button>
    <button class="nav-item" onclick="showPage('attendance')" id="nav-attendance">
      <span class="icon">📋</span> Attendance
    </button>
    <button class="nav-item" onclick="showPage('assignments')" id="nav-assignments">
      <span class="icon">📝</span> Assignments
    </button>
  </div>

  <div class="nav-section">
    <div class="nav-label">Finance</div>
    <button class="nav-item" onclick="showPage('fees')" id="nav-fees">
      <span class="icon">💰</span> Fees
    </button>
    <button class="nav-item" onclick="showPage('salaries')" id="nav-salaries" id="nav-salaries-btn">
      <span class="icon">💳</span> Salaries
    </button>
  </div>

  <div class="sidebar-footer">
    <button class="btn-logout" onclick="doLogout()">⎋ Sign Out</button>
  </div>
</nav>

<div id="main">
  <div id="topbar">
    <h2 id="page-title">Dashboard</h2>
    <div class="topbar-right">
      <span class="badge-role badge-admin" id="role-badge">admin</span>
      <span style="color:var(--muted);font-size:.82rem;" id="topbar-user">admin</span>
    </div>
  </div>
  <div id="content"></div>
</div>

<!-- ── Toast ──────────────────────────────────────────── -->
<div id="toast-container"></div>

<!-- ── Modal ──────────────────────────────────────────── -->
<div id="modal-overlay" class="modal-overlay hidden" onclick="closeModal(event)">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="modal-header">
      <h3 id="modal-title">Modal</h3>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body" id="modal-body"></div>
    <div class="modal-footer" id="modal-footer"></div>
  </div>
</div>

<script>
// ── Config ───────────────────────────────────────────────
const API = 'http://127.0.0.1:8000';
let token = localStorage.getItem('token');
let currentUser = JSON.parse(localStorage.getItem('currentUser') || 'null');
let currentPage = 'dashboard';

// ── API Helper ───────────────────────────────────────────
async function api(method, path, body = null) {
  const opts = {
    method,
    headers: { 'Content-Type': 'application/json' }
  };
  if (token) opts.headers['Authorization'] = 'Bearer ' + token;
  if (body) opts.body = JSON.stringify(body);
  try {
    const res = await fetch(API + path, opts);
    if (res.status === 401) { doLogout(); return null; }
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.detail || 'Request failed');
    return data;
  } catch (e) {
    toast(e.message, 'error');
    return null;
  }
}

async function apiForm(path, formData) {
  const res = await fetch(API + path, {
    method: 'POST',
    headers: { 'Authorization': 'Bearer ' + token },
    body: formData
  });
  return res.json();
}

// ── Toast ────────────────────────────────────────────────
function toast(msg, type = 'info') {
  const el = document.createElement('div');
  el.className = `toast toast-${type}`;
  el.textContent = msg;
  document.getElementById('toast-container').appendChild(el);
  setTimeout(() => el.remove(), 3500);
}

// ── Modal ────────────────────────────────────────────────
function openModal(title, body, footer = '') {
  document.getElementById('modal-title').textContent = title;
  document.getElementById('modal-body').innerHTML = body;
  document.getElementById('modal-footer').innerHTML = footer;
  document.getElementById('modal-overlay').classList.remove('hidden');
}
function closeModal(e) {
  if (!e || e.target === document.getElementById('modal-overlay'))
    document.getElementById('modal-overlay').classList.add('hidden');
}

// ── Auth ─────────────────────────────────────────────────
async function doLogin() {
  const user = document.getElementById('l-user').value.trim();
  const pass = document.getElementById('l-pass').value;
  const btn  = document.getElementById('login-btn');
  const err  = document.getElementById('login-err');
  err.style.display = 'none';
  btn.disabled = true;
  btn.innerHTML = '<span class="loader"></span>';

  const fd = new FormData();
  fd.append('username', user); fd.append('password', pass);
  try {
    const res = await fetch(API + '/auth/login', { method:'POST', body: fd });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || 'Login failed');
    token = data.access_token;
    localStorage.setItem('token', token);
    const me = await fetch(API + '/auth/me', { headers:{ Authorization:'Bearer '+token } });
    currentUser = await me.json();
    localStorage.setItem('currentUser', JSON.stringify(currentUser));
    bootApp();
  } catch(e) {
    err.textContent = e.message; err.style.display = 'block';
  }
  btn.disabled = false; btn.textContent = 'Sign In';
}

document.getElementById('l-pass').addEventListener('keydown', e => { if(e.key==='Enter') doLogin(); });

function doLogout() {
  token = null; currentUser = null;
  localStorage.removeItem('token'); localStorage.removeItem('currentUser');
  document.getElementById('login-screen').style.display = 'flex';
  document.getElementById('sidebar').style.display = 'none';
  document.getElementById('main').style.display = 'none';
}

function bootApp() {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('sidebar').style.display = 'flex';
  document.getElementById('main').style.display = 'flex';

  const u = currentUser;
  document.getElementById('sb-avatar').textContent  = u.username[0].toUpperCase();
  document.getElementById('sb-name').textContent    = u.username;
  document.getElementById('sb-role').textContent    = u.role;
  document.getElementById('topbar-user').textContent = u.username;
  const rb = document.getElementById('role-badge');
  rb.textContent = u.role;
  rb.className = 'badge-role badge-' + u.role;

  // Hide admin-only sections for non-admins
  if (u.role !== 'admin') {
    document.getElementById('nav-admin-section').style.display = 'none';
    document.getElementById('nav-salaries').style.display = 'none';
  }

  showPage('dashboard');
}

const pageTitles = {
  dashboard:'Dashboard', students:'Students', teachers:'Teachers',
  classes:'Classes', subjects:'Subjects', results:'Results',
  attendance:'Attendance', assignments:'Assignments', fees:'Fees', salaries:'Salaries'
};

function showPage(page) {
  currentPage = page;
  document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
  const navEl = document.getElementById('nav-' + page);
  if (navEl) navEl.classList.add('active');
  document.getElementById('page-title').textContent = pageTitles[page] || page;
  const pages = { dashboard, students, teachers, classes, subjects, results, attendance, assignments, fees, salaries };
  if (pages[page]) pages[page]();
}

async function viewReportCard(sid, name) {
  const data = await api('GET', `/results/report-card/${sid}`);
  if (!data) return;
  const gradeColor = (g) => {
    if (['A+','A'].includes(g)) return 'var(--success)';
    if (['B+','B'].includes(g)) return 'var(--accent)';
    if (['C+','C'].includes(g)) return 'var(--warn)';
    return 'var(--danger)';
  };
  openModal(`📊 Report Card — ${name}`,
    `<div class="report-header">
      <div>
        <div style="opacity:.7;font-size:.8rem;margin-bottom:4px">Student</div>
        <h2>${data.student.first_name} ${data.student.last_name}</h2>
        <div style="opacity:.7;margin-top:4px">${data.student.roll_number}</div>
      </div>
      <div style="text-align:center">
        <div class="grade-big" style="color:${gradeColor(data.overall_grade)}">${data.overall_grade}</div>
        <div style="margin-top:8px;opacity:.8">${data.overall_percentage}%</div>
      </div>
    </div>
    <table style="width:100%">
      <thead><tr><th>Subject</th><th>Exam</th><th>Marks</th><th>%</th><th>Grade</th></tr></thead>
      <tbody>${data.results.map(r => {
        const pct = r.total_marks > 0 ? ((r.marks_obtained/r.total_marks)*100).toFixed(1) : 0;
        return `<tr>
          <td>Subject #${r.subject_id}</td>
          <td><span class="tag tag-purple">${r.exam_type}</span></td>
          <td>${r.marks_obtained}/${r.total_marks}</td>
          <td>${pct}%</td>
          <td><b style="color:${gradeColor(r.grade)}">${r.grade||'—'}</b></td>
        </tr>`;
      }).join('')}</tbody>
    </table>
    <div style="margin-top:20px;padding:16px;background:var(--surface2);border-radius:8px;display:flex;justify-content:space-between">
      <span>Total: <b>${data.total_marks_obtained} / ${data.total_marks}</b></span>
      <span>Percentage: <b>${data.overall_percentage}%</b></span>
      <span>Overall Grade: <b style="color:${gradeColor(data.overall_grade)}">${data.overall_grade}</b></span>
    </div>`, '');
}

      <div class="form-group"><label>Allowances</label><input id="sl-allow" class="form-control" type="number" value="5000"/></div>
    </div>
    <div class="form-group"><label>Deductions</label><input id="sl-ded" class="form-control" type="number" value="0"/></div>
    <div class="form-group"><label>Remarks</label><input id="sl-rem" class="form-control"/></div>`,
  `<button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
   <button class="btn btn-primary" onclick="submitSalary()">Generate</button>`);
}

async function submitSalary() {
  const res = await api('POST', '/salaries/', {
    teacher_id: parseInt(document.getElementById('sl-tid').value),
    month: document.getElementById('sl-month').value,
    base_salary: parseFloat(document.getElementById('sl-base').value),
    allowances: parseFloat(document.getElementById('sl-allow').value),
    deductions: parseFloat(document.getElementById('sl-ded').value),
    remarks: document.getElementById('sl-rem').value || null,
  });
  if (res) { toast('Salary generated!', 'success'); closeModal(); salaries(); }
}

function bulkSalaryModal() {
  const months = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  const curr = months[new Date().getMonth()] + ' ' + new Date().getFullYear();
  openModal('Bulk Generate Salaries', `
    <p style="color:var(--muted);margin-bottom:16px">This will generate salary records for <b>all active teachers</b> using their base salary for the selected month.</p>
    <div class="form-group"><label>Month</label><input id="bulk-month" class="form-control" value="${curr}"/></div>`,
  `<button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
   <button class="btn btn-primary" onclick="submitBulkSalary()">⚡ Generate All</button>`);
}

async function submitBulkSalary() {
  const month = document.getElementById('bulk-month').value;
  const res = await api('POST', `/salaries/bulk?month=${encodeURIComponent(month)}`);
  if (res) { toast(res.message, 'success'); closeModal(); salaries(); }
}

async function markSalaryPaid(id) {
  const res = await api('PUT', '/salaries/' + id, {
    status: 'paid',
    paid_date: new Date().toISOString().split('T')[0],
  });
  if (res) { toast('Marked as paid!', 'success'); salaries(); }
}

// ── Utility: Filter Table ────────────────────────────────
function filterTable(input, tableId) {
  const q = input.value.toLowerCase();
  document.querySelectorAll(`#${tableId} tbody tr`).forEach(row => {
    row.style.display = row.textContent.toLowerCase().includes(q) ? '' : 'none';
  });
}

// ── Boot ─────────────────────────────────────────────────
if (token && currentUser) {
  bootApp();
} else {
  document.getElementById('sidebar').style.display = 'none';
  document.getElementById('main').style.display = 'none';
}
</script>
</body>
</html>
